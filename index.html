<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Woofly — Iniciar Sesión</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/login.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body id="page-login">

<div class="page-transition" aria-hidden="true">
  <div class="transition-content">
    <span class="transition-brand">WOOFLY</span>
    <span>Preparando tu dashboard</span>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="login-card">
  <div class="login-logo">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="1" y="1" width="62" height="62" rx="20" fill="#E5F0E9"/>
      <g fill="#527A61">
        <ellipse cx="20" cy="23" rx="4.5" ry="6" transform="rotate(-28 20 23)"/>
        <ellipse cx="29" cy="17" rx="4.5" ry="6" transform="rotate(-10 29 17)"/>
        <ellipse cx="40" cy="17" rx="4.5" ry="6" transform="rotate(10 40 17)"/>
        <ellipse cx="49" cy="23" rx="4.5" ry="6" transform="rotate(28 49 23)"/>
        <path d="M32 29c-7.2 0-13 6.1-13 12.1 0 3.2 2.2 5.2 5.2 5.2 2.1 0 4.8-1.3 7.8-1.3s5.7 1.3 7.8 1.3c3 0 5.2-2 5.2-5.2C45 35.1 39.2 29 32 29Z"/>
      </g>
    </svg>
    <div class="brand">WOOFLY</div>
  </div>

  <h1 class="login-title">¡Bienvenido!</h1>
  <p class="login-sub">El cuidado que tu mascota merece</p>

  <form id="loginForm">
    <div class="form-group">
      <label class="form-label" for="loginUser">
        <i data-lucide="user" width="15" height="15"></i> Usuario
      </label>
      <div class="input-wrap">
        <input class="form-input" id="loginUser" type="text" placeholder="Ingrese su usuario" value="Juan" autocomplete="username" required />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="loginPass">
        <i data-lucide="lock" width="15" height="15"></i> Contraseña
      </label>
      <div class="input-wrap">
        <input class="form-input" id="loginPass" type="password" placeholder="Ingrese su contraseña" value="woofly123" autocomplete="current-password" required />
        <button class="toggle-pwd" type="button" onclick="togglePwd()" aria-label="Mostrar contraseña">
          <i data-lucide="eye" id="eyeIcon" width="18" height="18"></i>
        </button>
      </div>
    </div>

    <button class="btn-primary" type="submit">Iniciar Sesión</button>
  </form>
  <button class="login-register" id="openRegister" type="button" aria-haspopup="dialog" aria-controls="registerOverlay">
    ¿No tienes cuenta? Regístrate aquí
  </button>
</div>

<div class="register-overlay" id="registerOverlay" hidden aria-hidden="true">
  <section class="register-card" role="dialog" aria-modal="true" aria-labelledby="registerTitle">
    <button class="register-close" id="closeRegister" type="button" aria-label="Cerrar registro">
      <i data-lucide="x" width="20" height="20"></i>
    </button>
    <div class="register-heading">
      <div class="register-icon"><i data-lucide="user-round-plus" width="24" height="24"></i></div>
      <h2 class="register-title" id="registerTitle">Crea tu cuenta</h2>
      <p class="register-sub">Únete a Woofly y cuida mejor de tus mascotas.</p>
    </div>
    <form id="registerForm">
      <div class="form-group">
        <label class="form-label" for="registerName"><i data-lucide="user" width="15" height="15"></i> Nombre completo</label>
        <input class="form-input" id="registerName" name="name" type="text" placeholder="Ej. María García" autocomplete="name" maxlength="80" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="registerUser"><i data-lucide="at-sign" width="15" height="15"></i> Usuario</label>
        <input class="form-input" id="registerUser" name="username" type="text" placeholder="Elige un usuario" autocomplete="username" minlength="3" maxlength="30" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="registerPass"><i data-lucide="lock" width="15" height="15"></i> Contraseña</label>
        <div class="register-password-wrap">
          <input class="form-input" id="registerPass" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="generatedPasswordHint" required />
          <button class="register-password-toggle" type="button" data-target="registerPass" aria-label="Mostrar contraseña">Mostrar</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="registerConfirm"><i data-lucide="shield-check" width="15" height="15"></i> Confirmar contraseña</label>
        <div class="register-password-wrap">
          <input class="form-input" id="registerConfirm" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" aria-describedby="generatedPasswordHint" required />
          <button class="register-password-toggle" type="button" data-target="registerConfirm" aria-label="Mostrar confirmación de contraseña">Mostrar</button>
        </div>
      </div>
      <p class="register-password-help" id="generatedPasswordHint">Generamos tu contraseña automáticamente. Muéstrala y guárdala para poder iniciar sesión.</p>
      <button class="btn-primary" type="submit">Crear cuenta</button>
    </form>
    <p class="register-login">¿Ya tienes cuenta? <button id="backToLogin" type="button">Inicia sesión</button></p>
  </section>
</div>

<script src="js/shared.js"></script>
<script src="js/login.js"></script>
</body>
</html>
